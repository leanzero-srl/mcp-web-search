name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 / npm 11 = what the workhorse runs in production. The lockfile is written by npm 11;
          # npm 10 (Node 20) rejects it ("Missing: esbuild@0.28.2 from lock file") and every run failed at npm ci.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Hermetic unit tests only (SSRF guard, cleanText, client detection,
      # YAML parsing). Integration / e2e suites hit live search engines and
      # are too flaky for CI — run them locally.
      - name: Unit tests
        run: npm run test:unit
